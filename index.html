<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111115" />
  <title>BLURT — Live Party Game</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="brandbar">
      <button class="brand" id="homeBtn" type="button">BLURT</button>
      <div class="room-pill hidden" id="roomPill">ROOM <strong id="roomCodeTop"></strong></div>
    </header>

    <section id="home" class="screen active center-screen">
      <div class="hero">
        <p class="eyebrow">LIVE MULTIPLAYER PARTY GAME</p>
        <h1>Type it.<br><span>Vote it.</span> Win it.</h1>
        <p class="sub">Join with a room code, type your funniest answer and let everyone else decide who gets the points.</p>
        <div class="home-actions">
          <button class="btn primary big" id="showHost">HOST A GAME</button>
          <button class="btn secondary big" id="showJoin">JOIN A GAME</button>
        </div>
      </div>
    </section>

    <section id="hostSetup" class="screen center-screen">
      <div class="panel narrow">
        <p class="eyebrow">NEW GAME</p>
        <h2>Host a room</h2>
        <label>Your name<input id="hostName" maxlength="20" placeholder="Enter your name" autocomplete="nickname"></label>
        <label>Number of questions
          <select id="hostRounds"><option>3</option><option selected>5</option><option>7</option><option>10</option></select>
        </label>
        <button class="btn primary full" id="createRoom">CREATE ROOM</button>
        <button class="link-btn" data-back>Back</button>
      </div>
    </section>

    <section id="joinSetup" class="screen center-screen">
      <div class="panel narrow">
        <p class="eyebrow">JOIN GAME</p>
        <h2>Enter the room code</h2>
        <label>Room code<input id="joinCode" class="code-input" maxlength="6" placeholder="A1B2C3" autocapitalize="characters"></label>
        <label>Your name<input id="joinName" maxlength="20" placeholder="Enter your name" autocomplete="nickname"></label>
        <button class="btn primary full" id="joinRoom">JOIN ROOM</button>
        <button class="link-btn" data-back>Back</button>
      </div>
    </section>

    <section id="game" class="screen">
      <div class="game-layout">
        <div class="main-card" id="mainCard"></div>
        <aside class="side-card" id="sideCard"></aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/app.js" defer></script>
</body>
</html>
